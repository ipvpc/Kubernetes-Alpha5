platform_software:
  - name: containerd
    version: latest
    scope: all
  - name: chrony
    version: latest
    scope: all
  - name: unattended-upgrades
    version: latest
    scope: all
  - name: helm
    version: latest
    scope: control_plane
  - name: prometheus-node-exporter
    version: latest
    scope: all
platform_updates:
