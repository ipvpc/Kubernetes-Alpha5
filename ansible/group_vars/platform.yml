    cron: "0 3 * * 0"
    scope: all
    action: unattended-upgrades
    job: /usr/bin/unattended-upgrade -d
    enabled: true
  - name: package-monthly
    cron: "0 4 1 * *"
    scope: all
    action: apt-upgrade
    job: "/usr/bin/apt-get update && /usr/bin/apt-get upgrade -y"
    enabled: false
